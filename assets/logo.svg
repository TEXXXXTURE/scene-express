<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scene Express logo">
  <defs>
    <radialGradient id="bg" cx="42%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#6B4526"/>
      <stop offset="55%" stop-color="#4A2F1D"/>
      <stop offset="100%" stop-color="#241510"/>
    </radialGradient>
    <filter id="leather" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" seed="5" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0.28 0" in="noise" result="tint"/>
      <feBlend in="SourceGraphic" in2="tint" mode="multiply"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFD9A0"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1E"/>
    </linearGradient>
    <linearGradient id="paperL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E9D9BA"/>
      <stop offset="100%" stop-color="#F7EEDC"/>
    </linearGradient>
    <linearGradient id="paperR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7EEDC"/>
      <stop offset="100%" stop-color="#E5D2AF"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B04A38"/>
      <stop offset="100%" stop-color="#8C3325"/>
    </linearGradient>
  </defs>

  <!-- 圆形皮革底 -->
  <circle cx="200" cy="200" r="192" fill="url(#bg)" filter="url(#leather)"/>

  <!-- 金色双环 -->
  <circle cx="200" cy="200" r="178" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.9"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.6"/>

  <!-- 顶部文字 -->
  <text x="200" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="4" fill="url(#gold)">SCENE EXPRESS</text>

  <!-- 打开的笔记本 -->
  <g transform="translate(200, 210)">
    <!-- 书脊 -->
    <rect x="-8" y="-88" width="16" height="176" rx="5" fill="#2E1C10"/>
    <!-- 左封面 -->
    <rect x="-128" y="-94" width="120" height="188" rx="12" fill="#7A5230" opacity="0.92"/>
    <!-- 右封面 -->
    <rect x="8" y="-94" width="120" height="188" rx="12" fill="#7A5230" opacity="0.92"/>
    <!-- 左纸页 -->
    <rect x="-114" y="-82" width="104" height="164" rx="5" fill="url(#paperL)"/>
    <!-- 右纸页 -->
    <rect x="10" y="-82" width="104" height="164" rx="5" fill="url(#paperR)"/>
    <!-- 左页烫金横线 -->
    <g stroke="#C9A227" stroke-width="2.4" opacity="0.85">
      <line x1="-100" y1="-52" x2="-22" y2="-52"/>
      <line x1="-100" y1="-34" x2="-22" y2="-34"/>
      <line x1="-100" y1="-16" x2="-34" y2="-16"/>
      <line x1="-100" y1="2" x2="-22" y2="2"/>
      <line x1="-100" y1="20" x2="-44" y2="20"/>
    </g>
    <!-- 右页烫金横线 -->
    <g stroke="#C9A227" stroke-width="2.4" opacity="0.85">
      <line x1="24" y1="-52" x2="102" y2="-52"/>
      <line x1="24" y1="-34" x2="102" y2="-34"/>
      <line x1="24" y1="-16" x2="88" y2="-16"/>
      <line x1="24" y1="2" x2="102" y2="2"/>
      <line x1="24" y1="20" x2="70" y2="20"/>
    </g>
    <!-- 书签带 -->
    <path d="M22 -82 L22 62 L32 48 L42 62 L42 -82 Z" fill="url(#ribbon)"/>
  </g>

  <!-- 底部文字 -->
  <text x="200" y="356" text-anchor="middle" font-family="'Noto Serif SC', 'SimSun', serif" font-size="15" letter-spacing="6" fill="#E9D9BA">羊皮人设笔记本</text>
</svg>
