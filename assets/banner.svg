<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scene Express 场景化表述路由">
  <defs>
    <radialGradient id="bg" cx="42%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#6B4526"/>
      <stop offset="55%" stop-color="#4A2F1D"/>
      <stop offset="100%" stop-color="#241510"/>
    </radialGradient>
    <filter id="leather" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0.30 0" in="noise" result="tint"/>
      <feBlend in="SourceGraphic" in2="tint" mode="multiply"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFC299"/>
      <stop offset="45%" stop-color="#B0A073"/>
      <stop offset="100%" stop-color="#7C6F4E"/>
    </linearGradient>
    <linearGradient id="paperL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E9D9BA"/>
      <stop offset="100%" stop-color="#F7EEDC"/>
    </linearGradient>
    <linearGradient id="paperR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7EEDC"/>
      <stop offset="100%" stop-color="#E5D2AF"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7A5230"/>
      <stop offset="100%" stop-color="#3E2717"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B04A38"/>
      <stop offset="100%" stop-color="#8C3325"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)" filter="url(#leather)"/>

  <rect x="60" y="18" width="1080" height="2" fill="url(#gold)" opacity="0.5"/>
  <rect x="60" y="280" width="1080" height="2" fill="url(#gold)" opacity="0.5"/>

  <g transform="translate(78, 52)">
    <rect x="118" y="4" width="12" height="192" rx="4" fill="#2E1C10"/>
    <rect x="-6" y="-2" width="130" height="204" rx="10" fill="url(#cover)" opacity="0.9"/>
    <rect x="124" y="-2" width="130" height="204" rx="10" fill="url(#cover)" opacity="0.9"/>
    <rect x="4" y="6" width="112" height="188" rx="4" fill="url(#paperL)" filter="url(#leather)"/>
    <rect x="132" y="6" width="112" height="188" rx="4" fill="url(#paperR)" filter="url(#leather)"/>
    <g stroke="#A98B5F" stroke-width="1.4" opacity="0.5">
      <line x1="16" y1="40" x2="104" y2="40"/>
      <line x1="16" y1="58" x2="104" y2="58"/>
      <line x1="16" y1="76" x2="96" y2="76"/>
      <line x1="16" y1="94" x2="104" y2="94"/>
      <line x1="16" y1="112" x2="84" y2="112"/>
    </g>
    <g stroke="#A98B5F" stroke-width="1.4" opacity="0.5">
      <line x1="144" y1="40" x2="232" y2="40"/>
      <line x1="144" y1="58" x2="232" y2="58"/>
      <line x1="144" y1="76" x2="218" y2="76"/>
      <line x1="144" y1="94" x2="232" y2="94"/>
      <line x1="144" y1="112" x2="200" y2="112"/>
    </g>
    <path d="M204 6 L204 150 L212 138 L220 150 L220 6 Z" fill="url(#ribbon)"/>
  </g>

  <g transform="translate(372, 128)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', 'Noto Serif SC', 'SimSun', serif" font-size="62" font-weight="bold" fill="url(#gold)" letter-spacing="1">Scene Express</text>
  </g>
</svg>