<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scene Express 场景化表述路由">
  <defs>
    <radialGradient id="bg" cx="42%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#5C3A21"/>
      <stop offset="55%" stop-color="#3A2415"/>
      <stop offset="100%" stop-color="#1E120C"/>
    </radialGradient>
    <filter id="leather" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0.30 0" in="noise" result="tint"/>
      <feBlend in="SourceGraphic" in2="tint" mode="multiply"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9BE72"/>
      <stop offset="45%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8F7220"/>
    </linearGradient>
    <linearGradient id="coverClosed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E3118"/>
      <stop offset="100%" stop-color="#241510"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A03C2D"/>
      <stop offset="100%" stop-color="#7C2A1F"/>
    </linearGradient>
  </defs>

  <!-- 皮革背景 -->
  <rect width="1200" height="300" fill="url(#bg)" filter="url(#leather)"/>

  <!-- 顶部/底部压暗金线 -->
  <rect x="60" y="16" width="1080" height="1.5" fill="url(#gold)" opacity="0.38"/>
  <rect x="60" y="282" width="1080" height="1.5" fill="url(#gold)" opacity="0.38"/>

  <!-- 左侧：合上的羊皮笔记本 -->
  <g transform="translate(78, 50)">
    <!-- 中缝书脊（合上后正面可见一条） -->
    <rect x="122" y="2" width="16" height="196" rx="7" fill="#1C0F09"/>
    <!-- 封面主体 -->
    <rect x="0" y="0" width="260" height="200" rx="16" fill="url(#coverClosed)" filter="url(#leather)"/>
    <!-- 封面压印金线框 -->
    <rect x="16" y="14" width="228" height="172" rx="12" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.55"/>
    <rect x="24" y="22" width="212" height="156" rx="9" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.35"/>
    <!-- 中央烫金印章 -->
    <circle cx="130" cy="92" r="33" fill="none" stroke="url(#gold)" stroke-width="1.8" opacity="0.8"/>
    <text x="130" y="99" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-style="italic" fill="url(#gold)">SE</text>
    <!-- 印章下方小字 -->
    <text x="130" y="148" text-anchor="middle" font-family="'Noto Serif SC', 'SimSun', 'Songti SC', serif" font-size="12" letter-spacing="4" fill="#A98B5F">人设笔记本</text>
    <!-- 书签带（底部露出） -->
    <path d="M156 200 L156 228 L165 215 L174 228 L174 200 Z" fill="url(#ribbon)"/>
    <!-- 封面下缘高光（质感） -->
    <rect x="6" y="194" width="248" height="6" rx="3" fill="#FFFFFF" opacity="0.04"/>
  </g>

  <!-- 右侧：标题区 -->
  <g transform="translate(370, 80)">
    <text x="0" y="56" font-family="Georgia, 'Times New Roman', 'Noto Serif SC', 'SimSun', serif" font-size="56" font-weight="bold" fill="url(#gold)" letter-spacing="1">Scene Express</text>
    <text x="2" y="104" font-family="'Noto Serif SC', 'SimSun', 'Songti SC', serif" font-size="25" fill="#D9C3A0" letter-spacing="4">场景化表述路由 · 一本羊皮人设笔记本</text>
    <text x="2" y="152" font-family="'Noto Serif SC', 'SimSun', 'Songti SC', serif" font-size="16" font-style="italic" fill="#B3946B" letter-spacing="1">限制是写不完的，引导比限制更有效。</text>
    <rect x="0" y="172" width="430" height="1.2" fill="url(#gold)" opacity="0.42"/>
    <text x="2" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9C7F58" letter-spacing="1">SCENE ROUTER · PERSONA CARDS · METRIC EXTRACTOR</text>
  </g>
</svg>
