<svg width="640" height="880" viewBox="0 0 640 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scene Express 场景化表述路由">
  <defs>
    <!-- 背景：暗褐渐变 -->
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#4A2C17"/>
      <stop offset="60%" stop-color="#2A1A0E"/>
      <stop offset="100%" stop-color="#180D08"/>
    </radialGradient>
    <filter id="bgTex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.28  0 0 0 0 0.17  0 0 0 0 0.09  0 0 0 0.22 0" in="n" result="t"/>
      <feBlend in="SourceGraphic" in2="t" mode="multiply"/>
    </filter>
    <!-- 封面：牛皮质感 -->
    <linearGradient id="cover" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#7A5230"/>
      <stop offset="45%" stop-color="#553520"/>
      <stop offset="100%" stop-color="#2E1C10"/>
    </linearGradient>
    <filter id="coverTex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="23" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.22  0 0 0 0 0.12  0 0 0 0.35 0" in="n" result="t"/>
      <feBlend in="SourceGraphic" in2="t" mode="multiply"/>
    </filter>
    <!-- 烫金 -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9BE72"/>
      <stop offset="45%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8F7220"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="640" height="880" fill="url(#bg)" filter="url(#bgTex)"/>

  <!-- 纸页边缘（从封面下沿与右沿露出） -->
  <rect x="116" y="112" width="412" height="668" rx="10" fill="#E0C9A2"/>
  <rect x="120" y="108" width="404" height="672" rx="10" fill="#EAD9B4"/>

  <!-- 皮质封面 -->
  <rect x="120" y="110" width="400" height="660" rx="10" fill="url(#cover)" filter="url(#coverTex)"/>

  <!-- 书脊：左侧深色装订区 -->
  <rect x="120" y="110" width="22" height="660" rx="10" fill="#2A1810" opacity="0.75"/>
  <!-- 装订缝线（手账线迹感） -->
  <line x1="138" y1="140" x2="138" y2="740" stroke="#1C0F09" stroke-width="1.6" stroke-dasharray="7 7" opacity="0.6"/>
  <!-- 封面右侧微高光（皮质光泽） -->
  <rect x="470" y="110" width="50" height="660" fill="#000000" opacity="0.12"/>

  <!-- 封面边缘磨损高光 -->
  <rect x="122" y="112" width="396" height="3" rx="1.5" fill="#A9845C" opacity="0.25"/>

  <!-- 压印细金线框 -->
  <rect x="156" y="150" width="328" height="580" rx="6" fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.4"/>
  <rect x="166" y="160" width="308" height="560" rx="4" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.22"/>

  <!-- 封面烫印文字 -->
  <text x="320" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', 'Noto Serif SC', 'SimSun', serif" font-size="46" font-weight="bold" fill="url(#gold)" letter-spacing="1">Scene Express</text>
  <text x="320" y="380" text-anchor="middle" font-family="'Noto Serif SC', 'SimSun', 'Songti SC', serif" font-size="22" fill="#D9C3A0" letter-spacing="8">场景化表述路由</text>

  <!-- 底部小字 -->
  <text x="320" y="660" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#9C7F58" letter-spacing="2">SCENE ROUTER · PERSONA CARDS</text>
  <text x="320" y="682" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#9C7F58" letter-spacing="2">METRIC EXTRACTOR</text>

  <!-- 底部纸页露出处阴影 -->
  <rect x="120" y="764" width="400" height="6" fill="#000000" opacity="0.18"/>
</svg>
